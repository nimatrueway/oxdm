name: Release

# Build platform bundles and attach them to the GitHub Release for a v* tag.
# macOS = Apple Silicon (aarch64), Windows = x86_64, Linux = x86_64.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  arch:
    name: Arch Linux (x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install package dependencies
        run: |
          source PKGBUILD
          test "$pkgver" = "${GITHUB_REF_NAME#v}"
          pacman -Syu --noconfirm --needed \
            "${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}" namcap
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build and check Arch package
        run: |
          sudo -u builder env CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            bash -c 'cd "$1"; makepkg --log' bash "$GITHUB_WORKSPACE"

      - name: Inspect and collect Arch package
        run: |
          source PKGBUILD
          package="${pkgname}-${pkgver}-${pkgrel}-x86_64.pkg.tar.zst"
          test -f "$package"
          namcap PKGBUILD "$package" | tee namcap.log
          if grep -q ' E: ' namcap.log; then
            exit 1
          fi
          pacman -U --noconfirm "$package"
          gst-inspect-1.0 autoaudiosink
          ldd /usr/bin/oxdm | tee ldd.log
          if grep -q 'not found' ldd.log; then
            exit 1
          fi
          mkdir -p out
          cp "$package" out/
          cd out
          sha256sum "$package" > "$package.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: out/*

  bundle:
    name: ${{ matrix.label }} (${{ matrix.pkg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-aarch64
            pkg: dmg
            ext: dmg
          - os: windows-latest
            label: windows-x86_64
            pkg: msi
            ext: msi
          # Debian/Ubuntu package. Unlike an AppImage, a .deb does NOT bundle
          # glib/gtk/webkit — it depends on the system ones, so the binary and
          # the WebKitWebProcess it spawns are always the same version. The
          # AppImage bundled an older glib/webkit that clashed on newer systems
          # (`undefined symbol: g_variant_builder_init_static`, then a WebKit IPC
          # mismatch -> grey window), and on Fedora couldn't find the webkit
          # helper at all. The dx RPM is also dropped (malformed cpio payload).
          # Built on 24.04 for forward-compat; installs on 24.04+. Fedora/RHEL
          # support is planned via Flatpak.
          - os: ubuntu-24.04
            label: ubuntu-x86_64
            pkg: deb
            ext: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev \
            gstreamer1.0-plugins-good gstreamer1.0-tools
          gst-inspect-1.0 autoaudiosink

      # Match the dioxus version pinned in Cargo.toml (=0.7.9).
      - uses: cargo-bins/cargo-binstall@main
      - name: Install dioxus-cli
        # Authenticate binstall's GitHub API calls — anonymous requests get
        # rate-limited (403) when fetching the dioxus-cli release artifact,
        # which intermittently failed the macOS job.
        #
        # --force: Swatinem/rust-cache restores binstall's install *record*
        # (so binstall thinks dioxus-cli is already installed and skips it)
        # without the actual `dx` binary in ~/.cargo/bin, leaving the Bundle
        # step with "dx: command not found". Forcing a reinstall guarantees
        # the binary is present every run.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall -y --force dioxus-cli@0.7.9

      # Cargo.toml patches `retina` to a git-ignored vendor/retina; fetch the
      # crate and apply patches/retina-*.patch before anything resolves deps.
      - name: Vendor patched retina
        shell: bash
        run: scripts/vendor-retina.sh

      - name: Bundle
        run: dx bundle --release --platform desktop --package-types ${{ matrix.pkg }}

      - name: Collect artifact
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # dx writes to target/dx/<app>/bundle; <app> follows the crate name
          # (now `oxvif-device-manager`), so match on the bundle dir + ext
          # rather than hardcoding the app subdir.
          src=$(find target/dx -type f -path '*/bundle/*' -name "*.${{ matrix.ext }}" | head -1)
          if [ -z "$src" ]; then echo "no .${{ matrix.ext }} produced"; exit 1; fi
          mkdir -p out
          cp "$src" "out/oxdm-${version}-${{ matrix.label }}.${{ matrix.ext }}"
          ls -la out

      # Windows also gets a no-install portable build alongside the MSI: the
      # self-contained oxdm.exe (CSS + icon are embedded, no sibling assets
      # dir), zipped flat. Like the MSI it relies on the WebView2 runtime,
      # which ships with Windows 10/11.
      - name: Add Windows portable zip
        if: matrix.pkg == 'msi'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          exe=$(find target -type f -name oxdm.exe -path '*release*' ! -path '*deps*' | head -1)
          if [ -z "$exe" ]; then echo "no oxdm.exe found"; exit 1; fi
          echo "portable exe: $exe"
          mkdir -p out
          # Copy to a flat name first so the zip holds `oxdm.exe` at its root,
          # not the full staging path (7z stores paths as given).
          cp "$exe" oxdm.exe
          7z a "out/oxdm-${version}-windows-x86_64-portable.zip" oxdm.exe
          rm oxdm.exe
          ls -la out

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Draft so the maintainer reviews/assembles all platforms before
          # publishing. Each matrix job appends its asset to the same draft.
          draft: true
          files: out/*
